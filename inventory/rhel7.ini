# RHEL 7.9 lab guests; verify identity and STIG findings before upstream enrollment.
[rhel7_nodes]
rhel7-node1 ansible_host=192.168.150.131
rhel7-node2 ansible_host=192.168.150.132

[rhel7_nodes:vars]
ansible_user=labadmin
ansible_ssh_private_key_file=/home/zrc/.ssh/id_ecdsa
ansible_ssh_common_args=-o StrictHostKeyChecking=yes
# Current guests have Python 2.7; use the dedicated ansible-core 2.16 EE.
ansible_python_interpreter=/usr/bin/python
